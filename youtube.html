<!DOCTYPE html>
<html>
  <head>
    <title>YouTube.com</title>

    <style>
      * {
        box-sizing: border-box;
      }


      p{
        font-family: Roboto, Arial, sans-serif;
      }


      .video-card{
        display: inline-block;
        width: auto;
        block-size: 282px;
        margin-right: 6px;
        margin-bottom: 0px;
        padding: 4px, 4px, 4px, 4px;
        vertical-align: top;
        background-color: rgb(17, 123, 141);
      }

      .video-card2{
        display: inline-block;
        block-size: 282px;
        margin-right: 6px;
        margin-bottom: 0px;
        padding: 4px 4px 4px 4px;
        vertical-align: top;
        background-color: rgb(219, 85, 219);
      }

      .thumbnail{
        width: 300px;
      }

      .search-bar{
        font-size: 20px;
        display: inline-block;
      }

      .middle-section{
        text-align: center;
        margin-top: auto;
        margin-bottom: 16px;
      }

      .search-bar:focus{
        outline: solid 1px rgb(31, 92, 198);
        border: 1px solid rgb(204, 204, 204);
        outline-offset: -1px;
        box-shadow: inset 0px 1px 2px rgb(238, 238, 238);
      }

      .channel-profile-pics{
        width: 36px;
        border-radius: 50%;
        display: inline-block;
        margin-top: 8px;
      }

      .channel-profile-pics-container{
        display: inline-block;
        width: 50px;
        height: auto;
        vertical-align: top;
        background-color: lightgreen;
        
      }

      .channel-profile-pics-container2{
        display: inline-block;
        width: 50px;
        height: auto;
        vertical-align: top;
        background-color: rgb(211, 238, 144);
        
      }      
      
      .video-info{
        display: inline-block;
        width: 240px;
        background-color: lightskyblue;
      }

      .video-info2{
        display: inline-block;
        width: 240px;
        background-color: lightskyblue;
      }      

      .video-title{
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        font-weight: 600;
        font-size: 14px;
        width: auto;
        line-height: 20px;
        margin-bottom: 0px;
        margin-top: 8px;
        display: block;

      }


      .author{
        color: rgb(102, 102, 102);
        display: block;
        font-size: 12px;
        margin-bottom: 0px;
        width: auto;
      }

      .video-stats{
        color: rgb(102, 102, 102);
        display: inline-block;
        width: auto;
        margin-top: 0px;
        margin-bottom: 0px;
        font-size: 12px;
        margin-bottom: 0px;
        margin-top: 0px;
      }

    </style>
  </head>

  <body>
    <div class="middle-section">
        <input class="search-bar" type="text" placeholder="Search">
        <button class="search-button tooltip-container">
          <img src="icons/search.svg"
            width="24px" height="19px">
        </button>            
    </div>

    <div class="video-card">

      <div>
        <img class="thumbnail" src="thumbnails/thumbnail-1.webp">  
      </div>
      <div>
        <div class="channel-profile-pics-container">
          <img class="channel-profile-pics" src="thumbnails/channel-1.jpeg">
        </div>
          <div class="video-info">
            <p class="video-title">
              Talking Tech and AI with Google CEO Sundar Pichai!
            </p>
            <p class="author">
              Marques Brownlee
            </p>

            <p class="video-stats">
              3.4M views &#183; 6 months ago
            </p>            
          </div>
      </div>
    </div>


    <div class="video-card2">
      <div>
        <img class="thumbnail" src="thumbnails/thumbnail-2.webp">  
      </div>
      <div>
        <div>
          <div class="channel-profile-pics-container2">
            <img class="channel-profile-pics" src="thumbnails/channel-2.jpeg">
      
          </div>
          <div class="video-info2">
            <p class="video-title">
              Try Not To Laugh Challenge #9
            </p>
            <p class="author">
              Markiplier
            </p>
            <p class="video-stats">
              19M views · 4 years ago
            </p>    
          </div>
        </div>     
    </div>    

  </body>




</html>
