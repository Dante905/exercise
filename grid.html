<!DOCTYPE html>
<html>
    <head>
        <title>Grid Practice</title>
    </head>
    <body>
        <div style="
            display: grid;
            grid-template-columns: 100px 100px;
            ">
            <div style="background-color: lightcoral;">div 1</div>
            <div style="background-color: lightgreen;">div 2<p>text</p></div>
        </div>

        <div style="
        margin-top: 30px;
            display: grid;
            grid-template-columns: 100px 1fr 4fr;
            ">
            <div style="background-color: lightcoral;">100px</div>
            <div style="background-color: lightseagreen;">100px<p>text</p></div>
            <div style="background-color: lightgreen;">200px</div>
                         
        </div>

        <div style="
        margin-top: 30px;

            <div style="background-color: lightgreen;">200px</div>
                         
        </div>

        <div style="

    </body>


</html>
